name: DeSmuME

on:
  - push
  - pull_request

jobs:
  build:
    name: Build DeSmuME (Linux)
    runs-on: ubuntu-26.04

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install dependencies
        run: sudo apt update && sudo apt install meson libsdl3-dev libpcap-dev libgtk-3-dev

      - name: meson
        run: |
          cd desmume/src/frontend/posix/
          meson setup build -Dfrontend-gtk=gtk3

      - name: ninja
        run: ninja -C desmume/src/frontend/posix/build

  build_gtk4:
    name: Build DeSmuME (Linux/GTK4)
    runs-on: ubuntu-26.04

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install dependencies
        run: sudo apt update && sudo apt install meson libgtk-4-dev libsdl3-dev libpcap-dev desktop-file-utils appstream xvfb

      # The default frontend is gtk3, so pin gtk4 explicitly for this job.
      - name: meson
        run: |
          cd desmume/src/frontend/posix/
          meson setup build-gtk4 -Dfrontend-gtk=gtk4

      - name: ninja
        run: ninja -C desmume/src/frontend/posix/build-gtk4

      - name: check that gtk4 was built
        run: test -x desmume/src/frontend/posix/build-gtk4/gtk4/desmume

      # P8: validate the GTK4 packaging assets and the UI resource so a
      # malformed desktop/metainfo/menu file fails CI instead of shipping.
      # gtk4-builder-tool initializes GDK even for plain GMenu files, so it
      # needs a display; xvfb provides one on the headless runner.
      - name: validate packaging assets
        run: |
          cd desmume/src/frontend/posix/gtk4
          desktop-file-validate org.desmume.DeSmuME.GTK4.desktop
          appstreamcli validate --no-net org.desmume.DeSmuME.GTK4.metainfo.xml
          xvfb-run -a gtk4-builder-tool validate menu.ui
          xvfb-run -a gtk4-builder-tool validate shortcuts.ui

      - name: install to staging dir
        run: |
          cd desmume/src/frontend/posix/
          DESTDIR=/tmp/gtk4-root meson install -C build-gtk4 --no-rebuild
          test -x /tmp/gtk4-root/usr/local/bin/desmume
          test -f /tmp/gtk4-root/usr/local/share/applications/org.desmume.DeSmuME.GTK4.desktop
          test -f /tmp/gtk4-root/usr/local/share/metainfo/org.desmume.DeSmuME.GTK4.metainfo.xml
          test -f /tmp/gtk4-root/usr/local/share/man/man1/desmume.1

  build_gtk2:
    name: Build DeSmuME (Linux/GTK+2)
    runs-on: ubuntu-26.04

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install dependencies
        run: sudo apt update && sudo apt install autoconf libglu1-mesa-dev libsdl3-dev libpcap-dev libgtk2.0-dev

      - name: buildit
        run: |
          cd desmume/src/frontend/posix/
          autoreconf -i
          ./configure --prefix=/usr --enable-gdb-stub --enable-wifi
          make -j8
          make DESTDIR=/tmp/DeSmuME install

      - name: Pack artifact
        run: |
          cd /tmp
          tar cJf DeSmuME.tar.xz DeSmuME/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desmume-linux-gtk2-cli-x86_64
          path: /tmp/DeSmuME.tar.xz

  build_mingw:
    name: Build DeSmuME (mingw/i686)
    runs-on: ubuntu-26.04

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install dependencies
        run: sudo apt update && sudo apt install mingw-w64 mingw-w64-i686-dev

      - name: buildit
        run: |
          cd desmume/src/frontend/windows/
          echo "OPT=-fstrength-reduce -fthread-jumps -fcse-follow-jumps -fcse-skip-blocks -frerun-cse-after-loop -fexpensive-optimizations -fforce-addr -fomit-frame-pointer -ffast-math -march=pentium4 -mtune=pentium4 -mmmx -msse2" > config.mak
          make -j8
          mkdir /tmp/DeSmuME
          cp desmume.exe /tmp/DeSmuME

      - name: Pack artifact
        run: |
          cd /tmp
          tar cJf DeSmuME.tar.xz DeSmuME/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desmume-mingw-win32
          path: /tmp/DeSmuME.tar.xz

  build_macos:
    name: Build DeSmuME (macOS)
    runs-on: macos-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        
      - name: install xcpretty
        run: gem install xcpretty
      
      - name: xcodebuild
        run: |
          cd desmume/src/frontend/cocoa/
          xcodebuild archive -project "DeSmuME (Latest).xcodeproj" -scheme "DeSmuME (macOS App; Universal -- Latest Xcode)" -destination "generic/platform=macOS" -archivePath "$(pwd)/desmume.xcarchive" | xcpretty -c
      
      - name: make zip
        run: |
          cd desmume/src/frontend/cocoa/desmume.xcarchive/Products/Applications/
          7z a DeSmuME.app.zip DeSmuME.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: desmume/src/frontend/cocoa/desmume.xcarchive/Products/Applications/DeSmuME.app.zip
          if-no-files-found: error 
